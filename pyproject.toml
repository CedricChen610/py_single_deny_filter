[project]
name = "py-single-deny-filter"
version = "0.1.1"
description = "A logging.Filter that drops records whose logger name contains one configured substring."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
